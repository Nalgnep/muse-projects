<main>

<script>
(function () {
  var parts = (location.pathname || "").split("/").filter(Boolean);
  var base = parts[0] === "muse-projects" ? "/muse-projects/" : "/";
  var pages = [
    ["portal/", "门户"],
    ["index.html", "算法课程"],
    ["industrial-ai-projects/", "实战项目"],

    ["industrial-ai-pitfalls/", "避坑手册"],
    ["industrial-ai-iot-dashboard/", "IoT 看板"]
  ];
  document.getElementById("links").innerHTML = pages.map(function (p) {
    return "<li><a href=\"" + base + p[0] + "\">" + p[1] + "</a></li>";
  }).join("");
})();
</script>
